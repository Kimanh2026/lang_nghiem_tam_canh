<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hỗ trợ trì tụng Chú Lăng Nghiêm và giữ thời khóa hằng ngày.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lăng Nghiêm">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20260921-29">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20260921-29"/>

  <title>Lăng Nghiêm Tâm Cảnh</title>
  <link rel="manifest" href="manifest.json?v=20260921-29">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // The installed mobile web app checks this uncached file whenever it opens,
    // returns to the foreground, reconnects, and once per minute while visible.
    const currentAppBuild = '1.5.14+31';
    const updateCheckIntervalMs = 60 * 1000;
    let updateCheckInFlight = false;

    function deployedBuildId(versionInfo) {
      if (!versionInfo || !versionInfo.version || !versionInfo.build_number) {
        return null;
      }
      return `${versionInfo.version}+${versionInfo.build_number}`;
    }

    async function checkForAppUpdate() {
      if (updateCheckInFlight || document.visibilityState === 'hidden') return;
      updateCheckInFlight = true;

      try {
        const response = await fetch(`version.json?check=${Date.now()}`, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' },
        });
        if (!response.ok) return;

        const newestBuild = deployedBuildId(await response.json());
        if (!newestBuild || newestBuild === currentAppBuild) return;

        // Prevent a reload loop if a proxy temporarily serves mismatched files.
        const attemptKey = `lang-nghiem-update-${newestBuild}`;
        const previousAttempt = Number(sessionStorage.getItem(attemptKey) || 0);
        if (Date.now() - previousAttempt < updateCheckIntervalMs) return;
        sessionStorage.setItem(attemptKey, String(Date.now()));

        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('v', newestBuild.replace(/[^a-zA-Z0-9.-]/g, '-'));
        window.location.replace(nextUrl.toString());
      } catch (_) {
        // Offline users keep using the current version and retry automatically.
      } finally {
        updateCheckInFlight = false;
      }
    }

    window.addEventListener('focus', checkForAppUpdate);
    window.addEventListener('pageshow', checkForAppUpdate);
    window.addEventListener('online', checkForAppUpdate);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkForAppUpdate();
    });
    window.setInterval(checkForAppUpdate, updateCheckIntervalMs);

    // Remove caches and registrations left by older Flutter PWA builds. This
    // never touches localStorage/IndexedDB, so PIN and practice data remain.
    async function prepareFreshRuntime() {
      let wasControlledByOldWorker = false;
      try {
        if ('serviceWorker' in navigator) {
          wasControlledByOldWorker = Boolean(navigator.serviceWorker.controller);
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ('caches' in window) {
          const cacheNames = await caches.keys();
          const flutterCaches = cacheNames.filter((name) =>
            name === 'flutter-app-cache' ||
            name === 'flutter-temp-cache' ||
            name.startsWith('flutter-app-manifest')
          );
          await Promise.all(flutterCaches.map((name) => caches.delete(name)));
        }
      } catch (_) {
        // Loading the app is more important than cache cleanup on old browsers.
      }

      const cleanupKey = 'lang-nghiem-service-worker-cleanup';
      if (wasControlledByOldWorker && sessionStorage.getItem(cleanupKey) !== currentAppBuild) {
        sessionStorage.setItem(cleanupKey, currentAppBuild);
        const cleanUrl = new URL(window.location.href);
        cleanUrl.searchParams.set('v', currentAppBuild.replace('+', '-'));
        window.location.replace(cleanUrl.toString());
        return false;
      }
      return true;
    }

    (async () => {
      if (!await prepareFreshRuntime()) return;
      await checkForAppUpdate();

      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js?v=20260921-33';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
